<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101816"><title>티끌모아 태산💸 | 부수입 챌린지</title><style>
:root{font-family:Inter,'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e9f5ec;background:#0c1412;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 90% 0,#1b4632 0,transparent 38%),#0c1412}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}input,textarea{color:#e9f5ec;background:#17241f;border:1px solid #35463d;border-radius:12px;padding:13px;width:100%;outline:none}input:focus,textarea:focus{border-color:#8ce0ae}textarea{resize:vertical;min-height:73px}input[type=date],input[type=time]{color-scheme:dark}.app{max-width:1100px;margin:auto;padding:26px 22px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:27px}.brand{font-weight:900;font-size:21px;letter-spacing:-.7px}.muted{color:#98b0a2;font-size:13px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#89b89e;font-weight:800}.pill{border:1px solid #355747;border-radius:999px;padding:7px 11px;color:#b6e8c7;font-size:12px;white-space:nowrap}.btn{border:0;border-radius:12px;padding:13px 17px;font-weight:800;background:#acffc0;color:#0c2214}.btn:hover{filter:brightness(1.06)}.btn.ghost{color:#d9f6e3;background:#263b30}.btn.danger{background:#3c2227;color:#ffafba}.btn.small{padding:8px 11px;font-size:12px}.card{border:1px solid #31453a;background:#14201b;border-radius:20px;padding:23px;box-shadow:0 9px 26px #00000015}.card.lime{background:linear-gradient(135deg,#d6ff97,#93e9b4);color:#11281a;border:0}.card.lime .muted{color:#416849}.card.lime .eyebrow{color:#517454}.card.lime .pill{border-color:#629c6d;color:#164326}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.stack{display:flex;flex-direction:column;gap:15px}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:25px;letter-spacing:-1px;margin:6px 0 8px}.big{font-size:38px;font-weight:900;letter-spacing:-1.6px}.label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.progress{height:11px;background:#345041;border-radius:50px;overflow:hidden}.progress>div{background:#a9ffbb;height:100%;border-radius:50px}.lime .progress{background:#a4d5a3}.lime .progress>div{background:#1c5c35}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{border:0;padding:11px 16px;border-radius:10px;background:transparent;color:#a8bcad;font-weight:700}.nav button.active{background:#b7ffc7;color:#12311e}.avatar{width:42px;height:42px;display:grid;place-items:center;border-radius:15px;background:#2e4a38;font-weight:900;color:#a9ffbb;flex-shrink:0}.person{display:flex;align-items:center;gap:12px}.divider{border:0;border-top:1px solid #314338;margin:16px 0}.value{font-size:24px;font-weight:900;letter-spacing:-.6px}.row-item{padding:15px 0;border-bottom:1px solid #293b31}.row-item:last-child{border:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hint{font-size:12px;color:#9cb5a4;line-height:1.65}.empty{padding:38px;text-align:center;color:#a6bcb0;border:1px dashed #45604e;border-radius:16px}.tag{font-size:11px;color:#94d9ac;background:#244332;padding:5px 8px;border-radius:7px}.notice{background:#203528;border:1px solid #426345;padding:12px 14px;color:#d4e8d8;border-radius:11px;font-size:13px;line-height:1.6}.error{background:#47272b;border-color:#855058;color:#ffc5c5}.link{background:none;border:0;color:#b4ffbc;text-decoration:underline;padding:0}.hero{max-width:660px;margin:52px auto 0}.hero h1{font-size:clamp(36px,7vw,66px);line-height:1.13;letter-spacing:-2.5px}.hero p{line-height:1.8}.circle{display:inline-grid;place-items:center;background:#b3ffc3;color:#163321;border-radius:100%;width:75px;height:75px;font-size:39px}.tools{display:flex;gap:8px;flex-wrap:wrap}.no-margin{margin:0}.footnav{display:none} @media(max-width:700px){.app{padding:18px 15px 105px}.grid,.grid3,.form-grid{grid-template-columns:1fr}.big{font-size:32px}.card{padding:19px}.nav{display:none}.footnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#13221bed;border-top:1px solid #34483b;padding:10px 6px max(10px,env(safe-area-inset-bottom));z-index:5;backdrop-filter:blur(14px)}.footnav button{border:0;background:transparent;color:#acc3b1;font-size:11px;padding:9px 2px}.footnav .active{color:#b4ffc2;font-weight:900}.hero{margin:23px auto 0}.top{margin-bottom:16px}}
.avatar-portrait{display:inline-grid;place-items:center;border-radius:15px;overflow:hidden;flex-shrink:0}.avatar-portrait svg{display:block}.avatar-builder{border:1px solid #425a47;border-radius:17px;padding:15px;background:#1a2b21}.avatar-preview{display:flex;gap:16px;align-items:center;margin-bottom:14px}.avatar-preview svg{width:128px;height:157px;max-width:35vw}.avatar-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.avatar-controls select{width:100%;border:1px solid #456451;border-radius:10px;background:#16251e;color:#e9f5ec;padding:11px}.avatar-controls label:last-child{grid-column:1/-1}.row-item .avatar-portrait{vertical-align:middle;margin-right:4px}@media(max-width:400px){.avatar-preview{flex-direction:column;text-align:center}.avatar-controls{grid-template-columns:1fr}.avatar-controls label:last-child{grid-column:auto}}
.profile-pic{background:#294a38;border:1px solid #416449;color:#d4ffdd;font-size:20px;font-weight:800;overflow:hidden;border-radius:50%}.profile-pic img{width:100%;height:100%;object-fit:cover;display:block}.photo-editor{display:flex;flex-direction:column;gap:13px;border:1px solid #405749;border-radius:16px;background:#1b2b22;padding:17px}.photo-button{width:max-content;cursor:pointer;border-radius:12px;background:#294936;color:#c5ffd3;padding:11px 15px;font-size:13px;font-weight:800}.photo-button:hover{background:#355c46}.photo-editor .person{align-items:center}</style></head><body><div id="app" class="app"></div><script src="config.js"></script><script>
'use strict';const KEY='side_hustle_v1_local',CFG='side_hustle_v1_cloud';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const won=n=>Math.round(Number(n)||0).toLocaleString('ko-KR')+'원';const num=n=>Number(String(n??'').replace(/,/g,''))||0;const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const uuid=()=>crypto.randomUUID();const $app=$('#app');let tab='home',mode='cloud',client=null,profile=null,members=[],entries=[],cloudConfig=JSON.parse(localStorage.getItem(CFG)||'null'),editEntryId=null,editProfile=false,busy=false,notice='',filterMonth='all';let local=JSON.parse(localStorage.getItem(KEY)||'{"members":[],"entries":[],"current":null}');
// 공통 공개키 설정이 존재하면 로컬 브라우저의 이전 입력보다 우선합니다.
const publicConfig=window.SHC_CONFIG;
if(publicConfig && /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(publicConfig.url||'') && /^(sb_publishable_|eyJ)/.test(publicConfig.key||'')){
  cloudConfig={url:publicConfig.url,key:publicConfig.key};
  localStorage.setItem(CFG,JSON.stringify(cloudConfig));
  mode='cloud';localStorage.setItem('side_mode','cloud');
}
const saveLocal=()=>localStorage.setItem(KEY,JSON.stringify(local));const hoursBetween=(a,b)=>{const p=x=>{let v=x.split(':').map(Number);return v[0]*60+v[1]};return ((p(b)-p(a)+1440)%1440)};const workEntries=(id)=>entries.filter(x=>x.user_id===id);const stats=(id)=>{let e=workEntries(id),sum=e.reduce((a,x)=>a+num(x.amount),0),mins=e.reduce((a,x)=>a+num(x.duration_minutes),0),rate=mins>0?sum/(mins/60):0;return {sum,mins,rate,remaining:Math.max(0,num(members.find(x=>x.id===id)?.goal_amount)-sum)}};const percent=(n,d)=>d>0?Math.min(100,n/d*100):0;const humanTime=m=>m>0?`${Math.floor(m/60)}시간 ${m%60?m%60+'분':''}`:`0시간`;const remainingHours=s=>s.remaining===0?'달성 완료 🎉':s.rate>0?`${(s.remaining/s.rate).toFixed(1)}시간`:'첫 수입을 기록해줘';const getMe=()=>members.find(x=>x.id===profile?.id)||profile;function toast(t,error=false){notice=(error?'오류: ':'')+t;render();}
function btn(label,action,cls='ghost',extra=''){return `<button class="btn ${cls}" data-action="${action}" ${extra}>${label}</button>`}function field(label,name,value='',type='text',attrs=''){return `<label><span class="label">${label}</span><input name="${name}" type="${type}" value="${esc(value)}" ${attrs}></label>`}function area(label,name,value='',attrs=''){return `<label><span class="label">${label}</span><textarea name="${name}" ${attrs}>${esc(value)}</textarea></label>`}function banner(){return notice?`<div class="notice ${notice.startsWith('오류:')?'error':''}" role="status">${esc(notice)} <button data-action="dismiss" class="link">닫기</button></div>`:''}

function avatarOf(p,size=48){const pic=p?.profile_photo;const initial=esc((p?.nickname||'친').slice(0,1));return `<span class="avatar-portrait profile-pic" style="width:${size}px;height:${size}px">${typeof pic==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(pic)?`<img src="${pic}" alt="${esc(p?.nickname||'친구')} 프로필 사진">`:`<span aria-label="기본 프로필">${initial}</span>`}</span>`}
function photoEditor(p){return `<section class="photo-editor"><div class="person"><div id="photoPreview">${avatarOf(p,74)}</div><div><b>프로필 사진 (선택)</b><p class="hint no-margin">사진을 선택하면 미리 볼 수 있어. 등록하지 않으면 닉네임 첫 글자가 표시돼.</p></div></div><label class="photo-button">📷 사진 선택하기<input type="file" name="photo_upload" accept="image/png,image/jpeg,image/webp" hidden></label>${p?.profile_photo?`<label class="hint"><input type="checkbox" name="remove_photo" value="yes" style="width:auto;margin-right:6px">현재 프로필 사진 삭제</label>`:''}<p class="hint no-margin">JPG·PNG·WEBP / 최대 10MB · 저장 시 작은 정사각형 사진으로 자동 변환</p></section>`}
async function shrinkPhoto(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('JPG, PNG 또는 WEBP 이미지만 업로드할 수 있어.');if(file.size>10*1024*1024)throw Error('사진은 10MB 이하로 선택해줘.');const bitmap=await createImageBitmap(file);try{const c=document.createElement('canvas');c.width=c.height=192;const ctx=c.getContext('2d');ctx.fillStyle='#f1f3ee';ctx.fillRect(0,0,192,192);const side=Math.min(bitmap.width,bitmap.height),x=(bitmap.width-side)/2,y=(bitmap.height-side)/2;ctx.drawImage(bitmap,x,y,side,side,0,0,192,192);return c.toDataURL('image/jpeg',0.78)}finally{bitmap.close()}}
async function updatePhotoPreview(input){const f=input.files?.[0];if(!f)return;try{const pic=await shrinkPhoto(f),preview=input.closest('form')?.querySelector('#photoPreview');if(preview)preview.innerHTML=avatarOf({profile_photo:pic,nickname:'나'},74)}catch(err){input.value='';alert(err.message)}}
function formatMoneyField(el){let raw=el.value.replace(/[^0-9]/g,'');el.value=raw?Number(raw).toLocaleString('ko-KR'):''}
function welcome(){return onlineConfig()}
function localChoose(){return `<div class="hero stack"><div class="eyebrow">LOCAL DEMO</div><h1 class="title">누구로 시작할래? 🐰</h1><p class="muted">한 기기에서 여러 친구 계정을 만들어 화면을 시험할 수 있어. 실제 친구들과 공유되지는 않아.</p>${banner()}${local.members.map(m=>`<div class="card between"><div class="person">${avatarOf(m)}<div><b>${esc(m.nickname)}</b><div class="muted">${esc(m.goal_title)} · ${won(m.goal_amount)}</div></div></div>${btn('접속','localSwitch','small',`data-id="${m.id}"`)}</div>`).join('')}<div class="card"><h3>새 닉네임 등록</h3>${profileForm('new-local')}</div>${btn('온라인 연결 설정','configureCloud')}${btn('처음 화면으로','welcome','ghost')}</div>`}
function profileForm(context){let p=context==='edit'?getMe():null;return `<form data-form="${context}" class="stack">${field('닉네임 *','nickname',p?.nickname||'','text','maxlength="18" required placeholder="돈미새토끼"')}${photoEditor(p)}${field('목표 제목 *','goal_title',p?.goal_title||'','text','maxlength="60" required placeholder="여행 자금 모으기"')}${field('목표 금액 (원) *','goal_amount',p?.goal_amount?num(p.goal_amount).toLocaleString('ko-KR'):'','text','inputmode="numeric" data-money required placeholder="2,000,000"')}${area('목표 설명 (선택)','goal_description',p?.goal_description||'','maxlength="240" placeholder="월급 건드리지 않고 모으기!"')}<button class="btn" type="submit">${context==='edit'?'프로필 저장하기':context==='new-local'?'프로필과 목표 저장하기':'챌린지 참여하기'}</button></form>`}
function onlineConfig(){return `<div class="hero stack"><div class="eyebrow">ONLINE MODE</div><h1 class="title">친구들이랑 연결하기 🌍</h1>${banner()}<div class="notice">운영자가 config.js를 설정하면 모든 친구에게 자동으로 연결돼. 아직 설정하지 않았다면 아래 두 값을 직접 입력해. 비밀번호나 service_role 키는 절대 입력하지 마!</div><form data-form="cloud-config" class="card stack">${field('Supabase Project URL','url',cloudConfig?.url||window.SHC_CONFIG?.url||'','url','required placeholder="https://xxxx.supabase.co"')}${field('Publishable Key 또는 anon public Key','key',cloudConfig?.key||'','text','required')}<button class="btn" type="submit">연결 및 로그인</button></form></div>`}
function login(){return `<div class="hero stack"><div class="eyebrow">FRIENDS ONLY</div><h1 class="title">우리끼리 로그인 🔐</h1>${banner()}<div class="card stack"><form data-form="signin" class="stack"><h3 class="no-margin">로그인</h3>${field('이메일','email','','email','required autocomplete="email"')}${field('비밀번호','password','','password','required autocomplete="current-password"')}<button class="btn" type="submit">로그인</button></form><hr class="divider"><form data-form="signup" class="stack"><h3 class="no-margin">처음이라면 회원가입</h3>${field('이메일','email','','email','required autocomplete="email"')}${field('비밀번호 (6자 이상)','password','','password','minlength="6" required autocomplete="new-password"')}<button class="btn ghost" type="submit">회원가입</button></form></div>${btn('연결 정보 확인','configureCloud')}</div>`}
function roomScreen(){return `<div class="hero stack"><div class="eyebrow">PRIVATE GROUP</div><h1 class="title">우리 모임 만들기 🫶</h1><p class="muted">첫 번째 사람은 모임을 만들고, 다른 친구들은 초대코드를 입력해서 참여해.</p>${banner()}<div class="grid"><div class="card stack"><h3 class="no-margin">내가 모임장!</h3>${btn('새 모임 만들기','createRoom','')}</div><form data-form="join-room" class="card stack"><h3 class="no-margin">친구 모임 참여</h3>${field('초대코드','code','','text','required maxlength="16" placeholder="예: A1B2C3D4"')}<button class="btn" type="submit">초대코드로 참여</button></form></div>${btn('로그아웃','logout')}</div>`}
function setupProfile(){return `<div class="hero stack"><div class="eyebrow">SET UP PROFILE</div><h1 class="title">너의 목표는 뭐야? 🎯</h1>${banner()}<div class="card">${profileForm('new-cloud')}</div></div>`}
function header(){return `<header class="top"><div><div class="eyebrow">SIDE HUSTLE CLUB</div><div class="brand">티끌모아 태산💸</div></div><div class="between"><span class="pill">${mode==='cloud'?'🌍 온라인':'🧪 체험'}</span><span class="muted">${esc(getMe()?.nickname||'')}</span></div></header><nav class="nav">${[['home','🏠 홈'],['income','💵 수입등록'],['rank','🏆 랭킹'],['history','📅 기록'],['mypage','👤 마이']].map(([id,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${label}</button>`).join('')}</nav><div style="height:18px"></div>${banner()}`}
function bottom(){return `<div class="footnav">${[['home','🏠<br>홈'],['income','💵<br>등록'],['rank','🏆<br>랭킹'],['history','📅<br>기록'],['mypage','👤<br>마이']].map(([id,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}">${label}</button>`).join('')}</div>`}
function home(){let me=getMe(),s=stats(me.id);let latest=[...entries].sort((a,b)=>(b.work_date+b.created_at).localeCompare(a.work_date+a.created_at)).slice(0,5);return `<div class="stack"><div><div class="eyebrow">MY SIDE HUSTLE GOAL</div><h1 class="title">${esc(me.goal_title)} ✨</h1><p class="muted">${esc(me.goal_description||'오늘도 한 발짝 가까워지는 중!')}</p></div><section class="card lime stack"><div class="between"><b>${esc(me.nickname)}의 목표</b><span class="pill">${percent(s.sum,me.goal_amount).toFixed(1)}% 달성</span></div><div class="muted" style="color:#315a3c;font-weight:700">목표 금액</div><div class="big">${won(me.goal_amount)}</div><div class="muted" style="color:#315a3c;font-weight:700;margin-top:4px">지금까지 모은 금액</div><div style="font-size:clamp(24px,4vw,31px);font-weight:850;letter-spacing:-1px">${won(s.sum)}</div><div class="progress"><div style="width:${percent(s.sum,me.goal_amount)}%"></div></div><div class="between"><b>남은 금액 ${won(s.remaining)}</b><b>앞으로 ${remainingHours(s)}</b></div></section><div class="grid3"><div class="card"><div class="muted">⏱️ 누적 근무시간</div><div class="value">${humanTime(s.mins)}</div></div><div class="card"><div class="muted">💵 평균 시간당 수입</div><div class="value">${s.rate?won(s.rate):'—'}</div></div><div class="card"><div class="muted">📦 수입 등록 횟수</div><div class="value">${workEntries(me.id).length}번</div></div></div><div class="between"><h2 class="title">친구들은 얼마나 벌었을까? 🏆</h2>${btn('전체 랭킹','goRank','small')}</div><div class="grid">${members.filter(x=>x.id!==me.id).map(m=>miniMember(m)).join('')||'<div class="empty">친구가 참여하면 여기에 나타나!</div>'}</div><div class="between"><h2 class="title">최근 수입 기록</h2>${btn('+ 수입 등록','goIncome','small')}</div><div class="card">${latest.length?latest.map(e=>entryRow(e,false)).join(''):'<div class="empty">아직 기록이 없어. 첫 알바 수입을 남겨봐!</div>'}</div></div>`}
function miniMember(m){let s=stats(m.id);return `<div class="card stack"><div class="person">${avatarOf(m)}<div><b>${esc(m.nickname)}</b><div class="muted">${esc(m.goal_title)}</div></div></div><b class="value">${won(s.sum)}</b><div class="progress"><div style="width:${percent(s.sum,m.goal_amount)}%"></div></div><div class="between"><span class="muted">목표 ${won(m.goal_amount)}</span><b>${percent(s.sum,m.goal_amount).toFixed(0)}%</b></div><div class="hint">남은 노동시간: ${remainingHours(s)}</div></div>`}
function income(){let edit=entries.find(x=>x.id===editEntryId&&x.user_id===profile.id);return `<div class="stack"><div><div class="eyebrow">ADD YOUR INCOME</div><h1 class="title">${edit?'수입 기록 수정':'오늘 얼마 벌었어? 💵'}</h1><p class="muted">시작·종료 시간과 받은 돈만 적으면 끝. 메모는 선택!</p></div><div class="card"><form data-form="income" class="stack">${field('일한 날짜 *','work_date',edit?.work_date||today(),'date','required')}<div class="form-grid">${field('시작 시간 *','start_time',edit?.start_time||'18:00','time','required')}${field('종료 시간 *','end_time',edit?.end_time||'02:00','time','required')}</div><div id="duration" class="notice">종료 시간이 더 빠르면 다음 날 퇴근한 것으로 계산해.</div>${field('실제로 받은 금액 (원) *','amount',edit?.amount||'','text','inputmode="numeric" data-money required placeholder="95,000"')}${area('간단 메모 (선택)','memo',edit?.memo||'','maxlength="300" placeholder="오늘 물량 미쳤음ㅋㅋㅋ, 첫 야간 알바 성공!"')}<div class="between"><button class="btn" type="submit">${edit?'수정 저장':'💰 수입 기록 등록'}</button>${edit?btn('수정 취소','cancelEdit','small'):''}</div></form></div><div class="notice">⏱️ 휴게시간을 따로 빼지 않고 출근~퇴근 시간 전체를 사용해 평균 시간당 수입을 계산해. 메모도 같은 그룹 친구에게 공개돼.</div></div>`}
function entryRow(e,actions){let m=members.find(x=>x.id===e.user_id),mine=e.user_id===profile.id;return `<div class="row-item between"><div style="min-width:0">${avatarOf(m,32)} <b>${esc(m?.nickname||'친구')}</b> <span class="muted">· ${esc(e.work_date)}</span><div class="muted">${esc(e.start_time)}~${esc(e.end_time)} · ${humanTime(e.duration_minutes)}</div>${e.memo?`<div style="font-size:13px;margin-top:6px;overflow-wrap:anywhere">💬 ${esc(e.memo)}</div>`:''}${actions&&mine?`<div class="tools" style="margin-top:9px">${btn('수정','editIncome','small',`data-id="${e.id}"`)}${btn('삭제','deleteIncome','small danger',`data-id="${e.id}"`)}</div>`:''}</div><div style="white-space:nowrap;text-align:right"><b>+${won(e.amount)}</b><div class="muted">${e.duration_minutes?won(e.amount/(e.duration_minutes/60))+'/시간':'—'}</div></div></div>`}
function ranks(){let sorted=[...members].sort((a,b)=>stats(b.id).sum-stats(a.id).sum);return `<div class="stack"><div class="eyebrow">FRIENDLY COMPETITION</div><h1 class="title">친구 랭킹 🏆</h1><div class="notice">서로의 목표 금액이 다르니까 누적 수입과 달성률을 함께 보여줘.</div><div class="grid"><div class="card stack"><h3 class="no-margin">💰 누적 수입 랭킹</h3>${sorted.map((m,i)=>rankRow(m,i,'sum')).join('')}</div><div class="card stack"><h3 class="no-margin">🎯 목표 달성률 랭킹</h3>${[...members].sort((a,b)=>percent(stats(b.id).sum,b.goal_amount)-percent(stats(a.id).sum,a.goal_amount)).map((m,i)=>rankRow(m,i,'rate')).join('')}</div></div><div class="card stack"><h3 class="no-margin">⏱️ 평균 시간당 수입 랭킹</h3><p class="muted no-margin">최소 한 번 이상 기록한 친구만 표시돼.</p>${[...members].filter(m=>stats(m.id).mins>0).sort((a,b)=>stats(b.id).rate-stats(a.id).rate).map((m,i)=>rankRow(m,i,'hour')).join('')||'<div class="empty">아직 근무 기록이 없어</div>'}</div></div>`}
function rankRow(m,i,type){let s=stats(m.id),v=type==='sum'?won(s.sum):type==='rate'?percent(s.sum,m.goal_amount).toFixed(1)+'%':won(s.rate)+'/시간';return `<div class="between" style="gap:10px"><div class="person"><b>${['🥇','🥈','🥉'][i]||`${i+1}위`}</b>${avatarOf(m,40)}<div><b>${esc(m.nickname)}</b><div class="muted">${esc(m.goal_title)}</div></div></div><b style="white-space:nowrap">${v}</b></div>`}
function history(){let visible=entries.filter(e=>filterMonth==='all'||e.work_date.startsWith(filterMonth)).sort((a,b)=>(b.work_date+b.created_at).localeCompare(a.work_date+a.created_at));return `<div class="stack"><div class="between"><div><div class="eyebrow">INCOME LOG</div><h1 class="title">우리들의 기록 📅</h1></div>${btn('+ 기록하기','goIncome','small')}</div><div class="card stack"><div class="between"><h3 class="no-margin">전체 수입 기록</h3><label style="width:155px"> <span class="label">기간</span><select id="monthSelect" style="width:100%;padding:10px;background:#17241f;color:white;border:1px solid #39503f;border-radius:10px"><option value="all" ${filterMonth==='all'?'selected':''}>전체 기간</option>${[...new Set(entries.map(e=>e.work_date.slice(0,7)))].sort().reverse().map(d=>`<option value="${d}" ${filterMonth===d?'selected':''}>${d}</option>`).join('')}</select></label></div>${visible.map(e=>entryRow(e,true)).join('')||'<div class="empty">해당 기간에 등록된 수입이 없어.</div>'}</div></div>`}
function mypage(){let me=getMe(),s=stats(me.id);return `<div class="stack"><div class="eyebrow">MY PAGE</div><h1 class="title">${esc(me.nickname)}의 마이페이지 👤</h1><div class="card stack"><div class="person">${avatarOf(me)}<div><h3 class="no-margin">${esc(me.goal_title)}</h3><div class="muted">${esc(me.goal_description||'설명을 자유롭게 추가해 봐!')}</div></div></div><hr class="divider"><div class="between"><span>목표 금액</span><b>${won(me.goal_amount)}</b></div><div class="between"><span>지금까지 번 돈</span><b>${won(s.sum)}</b></div><div class="between"><span>남은 노동시간</span><b>${remainingHours(s)}</b></div></div><div class="card stack"><h3 class="no-margin">닉네임과 목표 설정</h3>${profileForm('edit')}</div><div class="card stack"><h3 class="no-margin">모임 및 계정</h3>${mode==='cloud'?`<div class="between"><span>친구 초대코드</span><b>${esc(window.roomCode||'')}</b></div>${btn('초대코드 복사','copyInvite','small')}`:'<div class="hint">체험 모드는 같은 브라우저에서만 친구 프로필을 바꿔볼 수 있어.</div>'}${btn(mode==='cloud'?'로그아웃':'다른 친구 프로필로 바꾸기',mode==='cloud'?'logout':'localChoose')}${mode==='local'?btn('온라인 공유 설정','configureCloud'):''}</div></div>`}
function render(){if(mode==='welcome')$app.innerHTML=onlineConfig();else if(mode==='choose')$app.innerHTML=localChoose();else if(mode==='configure')$app.innerHTML=onlineConfig();else if(mode==='login')$app.innerHTML=login();else if(mode==='room')$app.innerHTML=roomScreen();else if(mode==='setup')$app.innerHTML=setupProfile();else if(profile)$app.innerHTML=header()+({home,income,rank:ranks,history,mypage}[tab]||home)()+bottom();else $app.innerHTML=onlineConfig();if(tab==='income'&&profile)updateDuration()}
function updateDuration(){let f=document.querySelector('[data-form=income]');if(!f)return;let a=f.elements.start_time.value,b=f.elements.end_time.value;let m=a&&b?hoursBetween(a,b):0;let el=$('#duration');if(el)el.textContent=m?`⏱️ 계산된 근무시간: ${humanTime(m)} (휴게시간 차감 없음)`:'시간을 입력해줘. 시작과 종료가 같으면 기록할 수 없어.'}
async function loadCloudScript(){if(window.supabase)return;await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';s.onload=resolve;s.onerror=()=>reject(new Error('Supabase 라이브러리를 불러오지 못했어. 인터넷 연결을 확인해줘.'));document.head.append(s)})}
async function initCloud(){await loadCloudScript();if(!cloudConfig?.url||!cloudConfig?.key)throw Error('Supabase 설정이 필요해.');client=window.supabase.createClient(cloudConfig.url,cloudConfig.key);let {data:{session},error}=await client.auth.getSession();if(error)throw error;if(!session){mode='login';profile=null;render();return}mode='cloud';await refreshCloud()}
async function refreshCloud(){let {data:{user},error:ue}=await client.auth.getUser();if(ue||!user){mode='login';profile=null;render();return}let {data:me,error}=await client.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error)throw error;if(!me){mode='room';profile=null;render();return}profile=me;if(!me.goal_title||!me.goal_amount){mode='setup';render();return}const [p,e,r]=await Promise.all([client.from('profiles').select('*').eq('room_id',me.room_id),client.from('entries').select('*').eq('room_id',me.room_id),client.from('rooms').select('code').eq('id',me.room_id).single()]);if(p.error)throw p.error;if(e.error)throw e.error;members=p.data||[];entries=e.data||[];window.roomCode=r.data?.code||'';mode='cloud';render()}
function localRestore(){profile=local.members.find(m=>m.id===local.current)||null;members=local.members;entries=local.entries;mode=profile?'local':'choose';render()}
async function act(action,id){notice='';try{if(action==='dismiss'){notice='';render();return}if(action==='welcome'){mode='configure';render();return}if(action==='startLocal'){mode='configure';render();return}if(action==='localChoose'){profile=null;mode='choose';render();return}if(action==='localSwitch'){local.current=id;saveLocal();localRestore();tab='home';render();return}if(action==='configureCloud'){mode='configure';render();return}if(action==='goIncome'){tab='income';editEntryId=null;render();return}if(action==='goRank'){tab='rank';render();return}if(action==='cancelEdit'){editEntryId=null;render();return}if(action==='copyInvite'){await navigator.clipboard.writeText(window.roomCode||'');toast('초대코드를 복사했어!');return}if(action==='logout'){await client.auth.signOut();profile=null;mode='login';render();return}if(action==='createRoom'){let {data,error}=await client.rpc('create_challenge_room');if(error)throw error;mode='setup';window.roomCode=data;await refreshCloud();return}if(action==='editIncome'){editEntryId=id;tab='income';render();return}if(action==='deleteIncome'){if(!confirm('이 수입 기록을 삭제할까?'))return; if(mode==='local'){local.entries=local.entries.filter(e=>!(e.id===id&&e.user_id===profile.id));saveLocal();localRestore()}else{let {error}=await client.from('entries').delete().eq('id',id).eq('user_id',profile.id);if(error)throw error;await refreshCloud()}toast('기록을 삭제했어.');return}}catch(e){toast(e.message,true)}}
async function submit(form){let data=Object.fromEntries(new FormData(form).entries());try{notice='';if(form.dataset.form==='cloud-config'){let url=data.url.trim().replace(/\/$/,'');if(!/^https:\/\/[\w.-]+\.supabase\.co$/.test(url))throw Error('올바른 Supabase URL을 입력해줘.');cloudConfig={url,key:data.key.trim()};localStorage.setItem(CFG,JSON.stringify(cloudConfig));localStorage.setItem('side_mode','cloud');await initCloud();return}if(['signin','signup'].includes(form.dataset.form)){let res=form.dataset.form==='signin'?await client.auth.signInWithPassword({email:data.email,password:data.password}):await client.auth.signUp({email:data.email,password:data.password});if(res.error)throw res.error;if(!res.data.session){toast('인증 메일이 발송됐을 수 있어. 메일 확인 후 로그인해줘.');return}await refreshCloud();return}if(form.dataset.form==='join-room'){let {error}=await client.rpc('join_challenge_room',{invite_code:data.code.trim().toUpperCase()});if(error)throw error;await refreshCloud();return}if(['edit','new-cloud','new-local'].includes(form.dataset.form)){let val={nickname:data.nickname.trim(),goal_title:data.goal_title.trim(),goal_description:data.goal_description.trim(),goal_amount:num(data.goal_amount),profile_photo:getMe()?.profile_photo||null};if(!val.nickname||!val.goal_title||!(val.goal_amount>0))throw Error('닉네임·목표 제목·목표 금액을 입력해줘.');if(data.remove_photo==='yes')val.profile_photo=null;const uploaded=form.elements.photo_upload?.files?.[0];if(uploaded)val.profile_photo=await shrinkPhoto(uploaded);if(mode==='local'||form.dataset.form==='new-local'){if(form.dataset.form==='new-local'){let id=uuid();local.members.push({id,...val});local.current=id}else local.members=local.members.map(x=>x.id===profile.id?{...x,...val}:x);saveLocal();localRestore()}else{let {data:{user},error:authError}=await client.auth.getUser();if(authError||!user)throw Error('로그인 세션이 만료됐어. 다시 로그인해줘.');let {error}=await client.from('profiles').update(val).eq('id',user.id);if(error)throw error;await refreshCloud()}tab='home';toast('목표와 닉네임 저장 완료!');return}if(form.dataset.form==='income'){let duration=hoursBetween(data.start_time,data.end_time);if(!duration)throw Error('시작과 종료 시간이 같아. 시간을 확인해줘.');if(!(num(data.amount)>0))throw Error('받은 금액을 입력해줘.');let item={work_date:data.work_date,start_time:data.start_time,end_time:data.end_time,amount:num(data.amount),memo:data.memo.trim(),duration_minutes:duration};if(mode==='local'){if(editEntryId){local.entries=local.entries.map(e=>e.id===editEntryId&&e.user_id===profile.id?{...e,...item}:e)}else local.entries.push({...item,id:uuid(),user_id:profile.id,created_at:new Date().toISOString()});saveLocal();localRestore()}else{let q=editEntryId?client.from('entries').update(item).eq('id',editEntryId).eq('user_id',profile.id):client.from('entries').insert({...item,user_id:profile.id,room_id:profile.room_id});let {error}=await q;if(error)throw error;await refreshCloud()}editEntryId=null;tab='history';toast('수입을 기록했어! 차곡차곡 모으자 💸');return}}catch(e){toast(e.message,true)}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b){e.preventDefault();act(b.dataset.action,b.dataset.id)}let t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;notice='';editEntryId=null;render()}});document.addEventListener('submit',e=>{let f=e.target.closest('[data-form]');if(f){e.preventDefault();submit(f)}});document.addEventListener('change',e=>{if(e.target.id==='monthSelect'){filterMonth=e.target.value;render()}if(e.target.name==='photo_upload')updatePhotoPreview(e.target)});document.addEventListener('input',e=>{if(['start_time','end_time'].includes(e.target.name))updateDuration();if(e.target.matches('[data-money]'))formatMoneyField(e.target)});
(async()=>{try{if(cloudConfig)await initCloud();else{mode='configure';render()}}catch(e){mode='configure';render();toast(e.message,true)}})();
</script></body></html>
